AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Patterns Module 3 - Orders service

Globals:
  Api:
    TracingEnabled: true

Parameters:
  UserPool:
    Type: String
    Default: local-user-pool
    Description: Cognito User Pool ID produced by the Users module

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: orderId
          KeyType: RANGE

  WorkshopApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: Module3CognitoAuthorizer
        Authorizers:
          Module3CognitoAuthorizer:
            UserPoolArn: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}

  PyUtils:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: pyutils
      Description: Shared utilities for Orders service
      ContentUri: src/layers/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  AddOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/order/create
      Handler: create_order.lambda_handler
      Runtime: python3.12
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders
            Method: post
            RestApiId: !Ref WorkshopApiGateway

  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/order/get
      Handler: get_order.lambda_handler
      Runtime: python3.12
      Tracing: Active
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Layers: [!Ref PyUtils]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: get
            RestApiId: !Ref WorkshopApiGateway

  ListOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/order/list
      Handler: list_orders.lambda_handler
      Runtime: python3.12
      Tracing: Active
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders
            Method: get
            RestApiId: !Ref WorkshopApiGateway

  EditOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/order/edit
      Handler: edit_order.lambda_handler
      Runtime: python3.12
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Layers: [!Ref PyUtils]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: put
            RestApiId: !Ref WorkshopApiGateway

  CancelOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/order/cancel
      Handler: cancel_order.lambda_handler
      Runtime: python3.12
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Layers: [!Ref PyUtils]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /orders/{orderId}
            Method: delete
            RestApiId: !Ref WorkshopApiGateway

Outputs:
  OrdersServiceEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${WorkshopApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod
  OrdersTable:
    Description: DynamoDB Orders table
    Value: !Ref OrdersTable
